name: BrandSoul Legal CI

on:
  push:
    paths:
      - "backend/**"
      - "brandsoul-frontend/**"
      - "scripts/smoke-legal.mjs"
      - ".env.legal.example"
      - "Dockerfile.legal"
      - "docker-compose.legal.yml"
      - "README_DEPLOY_LEGAL.md"
      - "render.legal.yaml"
      - "package.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "brandsoul-frontend/**"
      - "scripts/smoke-legal.mjs"
      - ".env.legal.example"
      - "Dockerfile.legal"
      - "docker-compose.legal.yml"
      - "README_DEPLOY_LEGAL.md"
      - "render.legal.yaml"
      - "package.json"
      - ".github/workflows/frontend.yml"

jobs:
  legal-build-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --include=dev

      - name: Run backend legal build
        working-directory: backend
        run: npm run build:legal

      - name: Install frontend dependencies
        working-directory: brandsoul-frontend
        run: npm ci --include=dev

      - name: Run frontend legal build
        working-directory: brandsoul-frontend
        run: npm run build:legal

      - name: Run legal smoke checks
        run: npm run smoke:legal
